[project]
name = "address_map"
authors = [{ name = "ALITECS Alexander Leisentritt", email = "info@alitecs.de" }]
description = "Show DocType documents with linked addresses on an interactive map"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
